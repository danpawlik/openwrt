name: Anything else
description: Board support, a proposal, a tracking note — not a bug report
labels: ["needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Something broken on an image from this tree goes in the **Bug report** form
        instead; this one is not triaged for completeness. Questions belong in the
        [forum thread](https://forum.openwrt.org/t/ipq5018-nss-offload-on-kernel-6-18-with-the-upstream-ethernet-stack-gl-b3000/253014).

        Reporting a board that now works? Say which one, which image or commit, and
        paste `cat /sys/kernel/debug/qca-dwmac-nss/status` and your measurements.
  - type: textarea
    id: body
    attributes:
      label: What and why
    validations:
      required: true
